[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "matrix-local-workspace"
version = "0.1.0"
description = "Local AI mission coordination and evidence workspace"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []
[project.scripts]
matrix-workspace = "matrix.__main__:main"
[tool.setuptools.packages.find]
include = ["matrix*"]
