name: MATRIX core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q matrix tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/release_gate.py
      - run: python -m pip wheel --no-deps . -w dist
      - run: python -m pip install --no-deps --no-index --find-links dist matrix-local-workspace
      - run: matrix-workspace --help
